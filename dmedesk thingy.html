<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DMEDesk Email personalization & Demo Hub</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #009e8e;
      --primary-hover: #007e71;
      --primary-light: #ecfdf5;
      --primary-border: #bbf7d0;
      --primary-glow: rgba(0, 158, 142, 0.15);
      
      --bg-main: #0b0f19;
      --bg-card: #131926;
      --bg-input: #1e2638;
      --border: #242f47;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dark: #0f172a;
      
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.15);
      --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.25);
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    /* Custom Scrollbar styling */
    *::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    *::-webkit-scrollbar-track {
      background: transparent;
    }
    *::-webkit-scrollbar-thumb {
      background-color: var(--border);
      border-radius: 3px;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-main);
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* App Header */
    header {
      background: rgba(19, 25, 38, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo svg {
      width: 32px;
      height: 32px;
      fill: var(--primary);
    }

    .header-title h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-title p {
      margin: 2px 0 0 0;
      font-size: 11px;
      color: var(--text-muted);
    }

    .header-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--primary);
      background: rgba(0, 158, 142, 0.1);
      border: 1px solid rgba(0, 158, 142, 0.2);
      padding: 3px 8px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
    }

    /* main Layout */
    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 61px);
      overflow: hidden;
    }

    /* Sidebar controls */
    .sidebar {
      width: 440px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .sidebar-section {
      background: rgba(11, 15, 25, 0.3);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .sidebar-section-header {
      padding: 12px 16px;
      background: rgba(30, 38, 56, 0.2);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-section-body {
      padding: 16px;
    }

    /* Form Fields */
    .field-group {
      margin-bottom: 12px;
    }

    .field-group.row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      transition: var(--transition);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    /* Template select buttons & items */
    .template-select-container {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .template-select-container select {
      flex: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
    }

    .btn:hover {
      background: var(--border);
      border-color: var(--text-muted);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 11px;
    }

    /* Sidebar Actions Panel */
    .sidebar-actions {
      padding: 16px 20px;
      background: rgba(19, 25, 38, 0.95);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .sidebar-actions .btn-primary {
      grid-column: span 2;
      padding: 12px;
      font-size: 14px;
    }

    /* Parser Box styling */
    .parser-textarea {
      font-family: var(--font-mono);
      font-size: 11px;
      height: 90px;
      background: rgba(11, 15, 25, 0.5);
    }

    /* Right Preview panel */
    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #111827;
      overflow: hidden;
    }

    /* Preview Toolbar */
    .preview-toolbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .toolbar-left, .toolbar-center, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Segmented Control / Tabs */
    .tabs-group {
      background: var(--bg-main);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: inline-flex;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }

    .tab-btn.active {
      background: var(--bg-input);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .toolbar-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
    }

    /* Zoom slider custom stylings */
    .zoom-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .zoom-control input[type="range"] {
      width: 80px;
      accent-color: var(--primary);
      cursor: pointer;
      padding: 0;
      background: transparent;
      border: none;
    }

    /* Device frame simulator */
    .preview-viewport-container {
      flex: 1;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      transition: background 0.3s ease;
      background-image: radial-gradient(var(--border) 1px, transparent 0);
      background-size: 24px 24px;
    }

    .preview-viewport-container.light-canvas {
      background-color: #f1f5f9;
    }

    .preview-viewport-container.dark-canvas {
      background-color: #0b0f19;
    }

    .device-wrapper {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s ease;
      border: 6px solid #1f2937;
      transform-origin: top center;
    }

    .device-header {
      background: #1f2937;
      color: #9ca3af;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      border-bottom: 1px solid #374151;
    }

    .device-header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .device-header .dot:nth-child(2) { background: #f59e0b; }
    .device-header .dot:nth-child(3) { background: #10b981; }
    
    .device-header .subject-bar {
      flex: 1;
      background: #111827;
      border-radius: 4px;
      padding: 3px 8px;
      color: #e5e7eb;
      font-family: var(--font-mono);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-left: 10px;
    }

    /* Iframe rendering */
    #preview-iframe {
      width: 100%;
      height: 700px;
      border: none;
      background: #ffffff;
      display: block;
    }

    /* Code View box */
    .source-editor-container {
      flex: 1;
      display: none;
      flex-direction: column;
      padding: 20px;
      overflow: hidden;
    }

    .source-editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .editor-textarea {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      background: #0b0f19;
      color: #a7f3d0;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      resize: none;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Variables highlight Checklist */
    .checklist-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 8px;
      background: rgba(11, 15, 25, 0.2);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .checklist-item .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .checklist-item.filled {
      border-color: rgba(16, 185, 129, 0.2);
      background: rgba(16, 185, 129, 0.05);
    }

    .checklist-item.filled .dot {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .checklist-item code {
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .checklist-item.filled code {
      color: var(--primary);
    }

    /* Spam score meter */
    .spam-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .spam-meter-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .spam-progress-bar {
      flex: 1;
      height: 8px;
      background: var(--bg-input);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .spam-progress-fill {
      height: 100%;
      width: 100%;
      background: var(--primary);
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .spam-score-badge {
      font-size: 14px;
      font-weight: 700;
      min-width: 42px;
      text-align: right;
    }

    .spam-warnings {
      font-size: 11px;
      color: var(--text-muted);
      max-height: 100px;
      overflow-y: auto;
      padding-left: 14px;
      margin: 0;
      line-height: 1.5;
    }

    .spam-warnings li {
      margin-bottom: 4px;
    }

    /* Toast alert notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--primary);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Info tooltips */
    .info-icon {
      display: inline-flex;
      cursor: help;
      color: var(--text-muted);
    }
    
    .info-icon:hover {
      color: var(--text-main);
    }

    /* Responsive design for small monitors */
    @media (max-width: 1024px) {
      .app-container {
        flex-direction: column;
        height: auto;
        overflow: auto;
      }
      .sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .preview-panel {
        height: 800px;
      }
      body {
        overflow: auto;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
    <span id="toast-text">HTML copied to clipboard!</span>
  </div>

  <!-- SVG Symbols for clean custom icons -->
  <svg style="display: none;">
    <symbol id="icon-logo" viewBox="0 0 24 24">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
    </symbol>
    <symbol id="icon-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="16 18 22 12 16 6"></polyline>
      <polyline points="8 6 2 12 8 18"></polyline>
    </symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </symbol>
  </svg>

  <header>
    <div class="header-logo">
      <svg><use href="#icon-logo"/></svg>
      <div class="header-title">
        <h1>DMEDesk Email personalization Engine</h1>
        <p>Outreach, Demo confirmation, & Calendar Integration Manager</p>
      </div>
    </div>
    <div class="header-badge">HIPAA SECURED CLIENT</div>
  </header>

  <div class="app-container">
    
    <!-- Sidebar Control Panel -->
    <div class="sidebar">
      <div class="sidebar-scroll">
        
        <!-- Template Selection -->
        <div class="sidebar-section">
          <div class="sidebar-section-header">
            <span>Template Management</span>
            <span class="info-icon" title="Switching templates resets variables unless customized">ℹ️</span>
          </div>
          <div class="sidebar-section-body">
            <div class="template-select-container">
              <select id="template-select" onchange="loadActiveTemplate()">
                <option value="outreach">Cold Outreach Template</option>
                <option value="demo">Demo Confirmation Template</option>
                <option value="followup">Demo Follow-Up Template</option>
                <option value="noshow">No-Show Reschedule Template</option>
              </select>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-sm" onclick="saveCurrentAsCustomTemplate()" style="flex: 1;">
                Save Active Custom
              </button>
              <button class="btn btn-sm btn-danger" onclick="resetToDefaultTemplates()" title="Reset all templates back to default">
                Reset Defaults
              </button>
            </div>
          </div>
        </div>

        <!-- Google Calendar Invite Parser -->
        <div class="sidebar-section">
          <div class="sidebar-section-header">
            <span>Google Invite Parser</span>
            <span class="info-icon" title="Paste raw google calendar invite text and parse it into variable inputs.">ℹ️</span>
          </div>
          <div class="sidebar-section-body" style="padding-bottom: 12px;">
            <div class="field-group">
              <textarea id="parser-input" class="parser-textarea" placeholder="Wednesday, May 13 · 10:00 AM – 10:45 AM&#10;Video call link:&#10;https://meet.google.com/iam-qafd-xkb"></textarea>
            </div>
            <button class="btn btn-primary btn-sm" onclick="triggerInviteParse()" style="width: 100%;">
              Parse & Populate Variables
            </button>
          </div>
        </div>

        <!-- Variables Form -->
        <div class="sidebar-section">
          <div class="sidebar-section-header">
            <span>Email Variables</span>
          </div>
          <div class="sidebar-section-body">
            
            <div class="field-group row">
              <div>
                <label>Prospect Name</label>
                <input type="text" id="input-name" placeholder="Aime" oninput="updateGeneratedHTML()" />
              </div>
              <div>
                <label>Company Name</label>
                <input type="text" id="input-company" placeholder="ABC Medical" oninput="updateGeneratedHTML()" />
              </div>
            </div>

            <div class="field-group">
              <label>Prospect Title</label>
              <input type="text" id="input-title" placeholder="Practice Manager" oninput="updateGeneratedHTML()" />
            </div>

            <div class="field-group">
              <label>Meeting Date</label>
              <input type="date" id="input-date" onchange="updateGeneratedHTML()" />
            </div>

            <div class="field-group row">
              <div>
                <label>Meeting Time</label>
                <input type="time" id="input-time" onchange="updateGeneratedHTML()" />
              </div>
              <div>
                <label>Meeting Duration</label>
                <select id="input-duration" onchange="updateGeneratedHTML()">
                  <option value="15">15 minutes</option>
                  <option value="30" selected>30 minutes</option>
                  <option value="45">45 minutes</option>
                  <option value="60">60 minutes</option>
                </select>
              </div>
            </div>

            <div class="field-group">
              <label>Meeting Timezone (Inputs timezone)</label>
              <select id="input-timezone" onchange="updateGeneratedHTML()">
                <!-- timezone options dynamically populated in JS -->
              </select>
            </div>

            <div class="field-group">
              <label>Google Meet URL</label>
              <input type="url" id="input-meet-link" placeholder="https://meet.google.com/abc-defg-hij" oninput="updateGeneratedHTML()" />
            </div>

            <div class="field-group">
              <label>CTA Link</label>
              <input type="url" id="input-cta-link" placeholder="https://cal.com/bendmedesk/30min" oninput="updateGeneratedHTML()" />
            </div>

            <div class="field-group row">
              <div>
                <label>Sender Name</label>
                <input type="text" id="input-sender-name" placeholder="Ben Arthur" oninput="updateGeneratedHTML()" />
              </div>
              <div>
                <label>Sender Email</label>
                <input type="email" id="input-sender-email" placeholder="ben@dmedesk.ai" oninput="updateGeneratedHTML()" />
              </div>
            </div>

            <div class="field-group">
              <label>Email Subject</label>
              <input type="text" id="input-subject" placeholder="Your DMEDesk Meeting" oninput="updateGeneratedHTML(true)" />
            </div>

          </div>
        </div>

        <!-- Checklist and Spam Panels -->
        <div class="sidebar-section">
          <div class="sidebar-section-header">
            <span>Variables Check</span>
          </div>
          <div class="sidebar-section-body">
            <div class="checklist-grid" id="variables-checklist">
              <!-- Checklist items populated dynamically -->
            </div>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section-header">
            <span>Spam Risk analysis</span>
          </div>
          <div class="sidebar-section-body spam-panel">
            <div class="spam-meter-wrapper">
              <div class="spam-progress-bar">
                <div class="spam-progress-fill" id="spam-fill"></div>
              </div>
              <div class="spam-score-badge" id="spam-score">100/100</div>
            </div>
            <div style="font-size: 11px; font-weight: 600;" id="spam-status">✅ Safe (Low Risk)</div>
            <ul class="spam-warnings" id="spam-warnings-list">
              <!-- warnings list -->
            </ul>
          </div>
        </div>

      </div>

      <!-- Action Panel -->
      <div class="sidebar-actions">
        <button class="btn btn-primary" onclick="copyHTMLAction()">
          <svg width="16" height="16"><use href="#icon-copy"/></svg>
          Copy Formatted Email (Real HTML)
        </button>

    // Retrieve normalized date & time details in America/New_York
    function getNormalizedDateTimeStrings() {
      const dateVal = document.getElementById("input-date").value;
      const timeVal = document.getElementById("input-time").value;
      const tzVal = document.getElementById("input-timezone").value;
      
      if (!dateVal || !timeVal) {
        return { dateStr: "[Schedule Date]", timeStr: "[Schedule Time]", dateObj: null };
      }
      
      // Parse in designated timezone using the offset-resolution logic
      const targetDate = parseInTimezone(dateVal, timeVal, tzVal);
      
      if (isNaN(targetDate.getTime())) {
        return { dateStr: "[Schedule Date]", timeStr: "[Schedule Time]", dateObj: null };
      }
      
      // Format to America/New_York
      const optionsDate = {
        timeZone: 'America/New_York',
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      };
      
      const optionsTime = {
        timeZone: 'America/New_York',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      };
      
      const optionsTZ = {
        timeZone: 'America/New_York',
        timeZoneName: 'short'
      };
      
      const dateStr = targetDate.toLocaleDateString('en-US', optionsDate);
      const timePart = targetDate.toLocaleTimeString('en-US', optionsTime);
      const tzPart = targetDate.toLocaleTimeString('en-US', optionsTZ).split(' ').pop();
      
      return {
        dateStr,
        timeStr: `${timePart} ${tzPart}`,
        dateObj: targetDate
      };
    }

    // Resolves UTC timestamp for date/time strings inside selected timezone
    function parseInTimezone(dateStr, timeStr, timeZone) {
      const localStr = `${dateStr}T${timeStr}:00`;
      let guess = new Date(`${localStr}Z`); // Treat as UTC first
      
      for (let i = 0; i < 3; i++) {
        const parts = new Intl.DateTimeFormat('en-US', {
          timeZone,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        }).formatToParts(guess);
        
        const y = parts.find(p => p.type === 'year').value;
        const m = parts.find(p => p.type === 'month').value;
        const d = parts.find(p => p.type === 'day').value;
        let h = parts.find(p => p.type === 'hour').value;
        const min = parts.find(p => p.type === 'minute').value;
        
        if (h === "24") h = "00";
        
        const formattedLocal = `${y}-${m}-${d}T${h}:${min}:00`;
        const diffMs = Date.parse(`${formattedLocal}Z`) - Date.parse(`${localStr}Z`);
        
        if (diffMs === 0) {
          return guess;
        }
        guess = new Date(guess.getTime() - diffMs);
      }
      return guess;
    }

      }

      // Extract Meet URL link
      const meetMatch = text.match(/https:\/\/meet\.google\.com\/[a-z]{3}-[a-z]{4}-[a-z]{3}/i);
      if (meetMatch) {
        document.getElementById("input-meet-link").value = meetMatch[0];
      }

      // Clean characters
      const cleanText = text.replace(/[\u2013\u2014-]/g, '-').replace(/\s+/g, ' ');

      // Time range: e.g. "10:00 AM - 10:45 AM"
      const timeRegex = /(\d{1,2}:\d{2}\s*(?:AM|PM|am|pm|a\.m\.|p\.m\.))\s*-\s*(\d{1,2}:\d{2}\s*(?:AM|PM|am|pm|a\.m\.|p\.m\.))/i;
      const timeMatch = cleanText.match(timeRegex);
      
      let startTime24 = "10:00";
      let durationVal = "30";

      if (timeMatch) {
        const startStr = timeMatch[1].trim().replace(/\./g, '').toUpperCase();
        const endStr = timeMatch[2].trim().replace(/\./g, '').toUpperCase();
        
        // Convert to 24 Hour formats
        startTime24 = convertTo24Hour(startStr);
        document.getElementById("input-time").value = startTime24;
        
        // Duration Calculation
        try {
          const dummyStart = new Date(`2000-01-01 ${startStr}`);
          const dummyEnd = new Date(`2000-01-01 ${endStr}`);
          if (!isNaN(dummyStart) && !isNaN(dummyEnd)) {
            const diffMin = Math.round((dummyEnd - dummyStart) / 60000);
            if (diffMin > 0) {
              durationVal = diffMin.toString();
              document.getElementById("input-duration").value = durationVal;
            }
          }
        } catch(e) {
          console.error("Failed duration math", e);
        }
      }

      // Date parsing check: e.g. "Wednesday, May 13" or "May 13, 2026"
      const dateRegex = /(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)?,?\s*(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(\d{4})?/i;
      const dateMatch = cleanText.match(dateRegex);
      
      const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const monthAbbrs = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      let targetYear = new Date().getFullYear();

      if (dateMatch) {
        const monthName = dateMatch[1];
        const dayNum = parseInt(dateMatch[2]);
        if (dateMatch[3]) {
          targetYear = parseInt(dateMatch[3]);
        }
        
        let monthIdx = months.findIndex(m => m.toLowerCase() === monthName.toLowerCase());
        if (monthIdx === -1) {
          monthIdx = monthAbbrs.findIndex(m => m.toLowerCase() === monthName.toLowerCase());
        }
        
        if (monthIdx !== -1) {
          const padMonth = String(monthIdx + 1).padStart(2, '0');
          const padDay = String(dayNum).padStart(2, '0');
          document.getElementById("input-date").value = `${targetYear}-${padMonth}-${padDay}`;
        }
      }

      // Automatically assume Google Calendar copy was from rep's local browser timezone
      const localZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "America/New_York";
      const tzSelect = document.getElementById("input-timezone");
      if (tzSelect) {
        tzSelect.value = localZone;
      }

      // Compile generated HTML updates
      updateGeneratedHTML();
      
      // Auto-trigger switch template back if on outreach
      if (activeTemplateType === "outreach") {
        document.getElementById("template-select").value = "demo";
        loadActiveTemplate();
      }

      showToast("Invite details successfully parsed!");
    }

    // Convert AM/PM to HH:MM format helper
    function convertTo24Hour(timeStr) {
      const match = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
      if (!match) return "10:00";
      
      let hours = parseInt(match[1]);
      const mins = match[2];
      const ampm = match[3].toUpperCase();
      
      if (ampm === "PM" && hours < 12) hours += 12;
      if (ampm === "AM" && hours === 12) hours = 0;
      
      return `${String(hours).padStart(2, '0')}:${mins}`;
    }

    // Rule-based Spam score checker heuristic
    function runSpamCheck(subject, bodyText) {
      let score = 100;
      const warnings = [];

      // Check subject criteria
      if (subject === subject.toUpperCase() && subject.trim().length > 4) {
        score -= 20;
        warnings.push("Subject line is in ALL CAPS. This triggers spam filters.");
      }

      const spamTriggers = [
        { word: "free", penalty: 10, label: "'Free'" },
        { word: "guarantee", penalty: 10, label: "'Guarantee'" },
        { word: "no risk", penalty: 10, label: "'No Risk'" },
        { word: "earn", penalty: 8, label: "'Earn'" },
        { word: "save cash", penalty: 8, label: "'Save Cash'" },
        { word: "act now", penalty: 10, label: "'Act Now'" },
        { word: "100%", penalty: 8, label: "'100%'" }
      ];

      spamTriggers.forEach(trigger => {
        const regexSub = new RegExp(`\\b${trigger.word}\\b`, 'gi');
        if (regexSub.test(subject)) {
          score -= trigger.penalty;
          warnings.push(`Spam keyword ${trigger.label} found in Subject line.`);
        }
      });

      // Check excessive exclamation marks
      if (/\!{2,}/g.test(subject) || /\!{2,}/g.test(bodyText)) {
        score -= 15;
        warnings.push("Excessive exclamation marks (e.g. '!!') detected.");
      }

      // Check email template sizes
      const doc = new DOMParser().parseFromString(bodyText, 'text/html');
      const textLength = doc.body.textContent.trim().length;
      if (textLength < 80) {
        score -= 15;
        warnings.push("Email content is very short (< 80 characters).");
      }

      // Check unsubscribe footer on Cold Outreach
      if (activeTemplateType === "outreach") {
        if (!bodyText.toLowerCase().includes("unsubscribe")) {
          score -= 25;
          warnings.push("No unsubscribe links found in Cold Outreach template.");
        }
      }

      // Check image ALT attributes
      const images = doc.querySelectorAll('img');
      let missingAlt = false;
      images.forEach(img => {
        if (!img.getAttribute('alt')) {
          missingAlt = true;
        }
      });
      if (missingAlt) {
        score -= 10;
        warnings.push("Images missing descriptive 'alt' tag attributes.");
      }

      // Clamp score
      score = Math.max(0, score);

      // Render score indicators
      const scoreBadge = document.getElementById("spam-score");
      const scoreFill = document.getElementById("spam-fill");
      const statusText = document.getElementById("spam-status");
      const warningList = document.getElementById("spam-warnings-list");

      scoreBadge.innerText = `${score}/100`;
      scoreFill.style.width = `${score}%`;
      warningList.innerHTML = "";

      if (score >= 85) {
        scoreFill.style.background = "#10b981"; // green
        statusText.innerText = "✅ Excellent (Low Spam Risk)";
        statusText.style.color = "#10b981";
      } else if (score >= 60) {
        scoreFill.style.background = "#f59e0b"; // orange
        statusText.innerText = "⚠️ Moderate Spam Risk";
        statusText.style.color = "#f59e0b";
      } else {
        scoreFill.style.background = "#ef4444"; // red
        statusText.innerText = "🚨 Critical Spam Risk";
        statusText.style.color = "#ef4444";
      }

      if (warnings.length > 0) {
        warnings.forEach(warn => {
          const li = document.createElement("li");
          li.innerText = warn;
          warningList.appendChild(li);
        });
      } else {
        const li = document.createElement("li");
        li.innerText = "No spam issues detected.";
        warningList.appendChild(li);
      }
    }

    // Save custom templates to localStorage
    function saveCurrentAsCustomTemplate() {
      const type = document.getElementById("template-select").value;
      const body = document.getElementById("source-editor").value;
      
      localStorage.setItem(`dmedesk_tpl_${type}`, body);
      showToast(`Custom ${type} template successfully saved.`);
    }

    // Reset templates to defaults
    function resetToDefaultTemplates() {
      if (confirm("Reset templates? This will overwrite your custom modifications.")) {
        for (const key in defaultTemplates) {
          localStorage.removeItem(`dmedesk_tpl_${key}`);
        }
        loadActiveTemplate();
        showToast("Restored all default templates.");
      }
    }

    // Switch Visual / HTML Source Tabs
    function switchView(mode) {
      const visualTab = document.getElementById("tab-visual");
      const sourceTab = document.getElementById("tab-source");
      const viewport = document.getElementById("viewport-container");
      const editor = document.getElementById("editor-container");
      const deviceGroup = document.getElementById("device-group");

      if (mode === "visual") {
        visualTab.classList.add("active");
        sourceTab.classList.remove("active");
        viewport.style.display = "flex";
        editor.style.display = "none";
        deviceGroup.style.display = "inline-flex";
        isEditingSource = false;
        
        // Sync editor state to preview
        updateGeneratedHTML();
      } else {
        visualTab.classList.remove("active");
        sourceTab.classList.add("active");
        viewport.style.display = "none";
        editor.style.display = "flex";
        deviceGroup.style.display = "none";
        isEditingSource = true;
      }
    }

    // Device View Mode frame toggling
    function setDeviceMode(device) {
      const desktopBtn = document.getElementById("device-desktop");
      const mobileBtn = document.getElementById("device-mobile");
      const frame = document.getElementById("device-frame");

      if (device === "desktop") {
        desktopBtn.classList.add("active");
        mobileBtn.classList.remove("active");
        frame.style.width = "100%";
        frame.style.maxWidth = "640px";
      } else {
        desktopBtn.classList.remove("active");
        mobileBtn.classList.add("active");
        frame.style.width = "375px";
        frame.style.maxWidth = "375px";
      }
    }

    // Canvas Background options
    function setPreviewCanvasTheme(theme) {
      const lightBtn = document.getElementById("theme-light");
      const darkBtn = document.getElementById("theme-dark");
      const container = document.getElementById("viewport-container");

      if (theme === "light") {
        lightBtn.classList.add("active");
        darkBtn.classList.remove("active");
        container.classList.remove("dark-canvas");
        container.classList.add("light-canvas");
      } else {
        lightBtn.classList.remove("active");
        darkBtn.classList.add("active");
        container.classList.remove("light-canvas");
        container.classList.add("dark-canvas");
      }
    }

    // Zoom scaling
    function adjustZoom(val) {
      const frame = document.getElementById("device-frame");
      document.getElementById("zoom-value").innerText = `${val}%`;
      const scale = val / 100;
      frame.style.transform = `scale(${scale})`;
    }

    // Apply manual edits made directly in HTML Source editor
    function applySourceEdits() {
      updateGeneratedHTML();
      showToast("Source changes applied successfully.");
    }

    // Trigger update automatically on source code keypresses
    function onSourceEditorChange() {
      // Live sync variables behind the scenes
      updateGeneratedHTML();
    }

    // Format & Beautify HTML Source
    function beautifyEditorHTML() {
      const editor = document.getElementById("source-editor");
      const rawHTML = editor.value;
      
      const formatted = formatHTMLCode(rawHTML);
      editor.value = formatted;
      showToast("HTML source code beautified.");
    }

    // HTML source code formatting utility
    function formatHTMLCode(html) {
      let formatted = '';
      let indent = '';
      const tab = '  ';
      
      const tokens = html.split(/(<\/?[a-zA-Z0-9_\-]+(?:\s+[a-zA-Z0-9_\-]+(?:=(?:"[^"]*"|'[^']*'|[^>\s]+))?)*\s*\/?>)/);
      
      for (let i = 0; i < tokens.length; i++) {
        let token = tokens[i];
        if (!token) continue;
        token = token.trim();
        if (!token) continue;
        
        if (token.startsWith('</')) {
          indent = indent.substring(tab.length);
          formatted += '\n' + indent + token;
        } else if (token.startsWith('<') && !token.startsWith('<!') && !token.endsWith('/>') && !token.startsWith('<meta') && !token.startsWith('<link') && !token.startsWith('<img') && !token.startsWith('<br') && !token.startsWith('<hr')) {
          formatted += '\n' + indent + token;
          indent += tab;
        } else {
          formatted += '\n' + indent + token;
        }
      }
      return formatted.trim();
    }

    function fallbackCopyText(text, successMessage, errorMessage) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.pointerEvents = 'none';
        textarea.style.opacity = '0';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        const success = document.execCommand('copy');
        document.body.removeChild(textarea);
        if (success) {
          showToast(successMessage);
        } else {
          showToast(errorMessage, true);
        }
      } catch (err) {
        console.error("Text copy fallback failed:", err);
        showToast(errorMessage, true);
      }
    }

    function runSelectionCopyFallback(htmlContent) {
      try {
        const container = document.createElement('div');
        container.style.position = 'fixed';
        container.style.pointerEvents = 'none';
        container.style.opacity = '0';
        container.style.left = '-9999px';
        
        container.innerHTML = htmlContent;
        document.body.appendChild(container);
        
        const range = document.createRange();
        range.selectNodeContents(container);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        
        const success = document.execCommand('copy');
        selection.removeAllRanges();
        document.body.removeChild(container);
        
        if (success) {
          showToast("Rich formatted HTML copied to clipboard!");
        } else {
          fallbackCopyText(htmlContent, "Plain HTML source code copied to clipboard (rich-copy fallback).", "Failed to copy email.");
        }
      } catch (err) {
        console.error("Selection copy fallback failed:", err);
        fallbackCopyText(htmlContent, "Plain HTML source code copied to clipboard (rich-copy fallback).", "Failed to copy email.");
      }
    }

    /* Clipboard Copy Action (Rich Format HTML) */
    async function copyHTMLAction() {
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          const htmlBlob = new Blob([currentGeneratedHTML], { type: "text/html" });
          const plainTextBlob = new Blob([stripHTML(currentGeneratedHTML)], { type: "text/plain" });
          
          const data = [
            new ClipboardItem({
              "text/html": htmlBlob,
              "text/plain": plainTextBlob
            })
          ];
          
          await navigator.clipboard.write(data);
          showToast("Rich formatted HTML copied to clipboard!");
        } else {
          runSelectionCopyFallback(currentGeneratedHTML);
        }
      } catch (err) {
        console.error("ClipboardItem failed. Fallback to selection copy", err);
        runSelectionCopyFallback(currentGeneratedHTML);
      }
    }

    // Export HTML output file
    function exportHTMLAction() {
      const filename = `dmedesk-${activeTemplateType}-email.html`;
      downloadBlob(currentGeneratedHTML, filename, "text/html");
      showToast(`Exported ${filename}`);
    }

    // Export Outlook/Thunderbird EML format
    function exportEMLAction() {
      const subject = document.getElementById("input-subject").value || "DMEDesk Notification";
      const senderName = document.getElementById("input-sender-name").value || "DMEDesk Representative";
      const senderEmail = document.getElementById("input-sender-email").value || "info@dmedesk.ai";
      
      const emlContent = `Subject: ${subject}
From: "${senderName}" <${senderEmail}>
MIME-Version: 1.0
Content-Type: text/html; charset="utf-8"

${currentGeneratedHTML}`;

      const filename = `dmedesk-${activeTemplateType}-email.eml`;
      downloadBlob(emlContent, filename, "message/rfc822");
      showToast(`Exported ${filename}`);
    }

    // Export TXT output (strip tags)
    function exportTXTAction() {
      const plainText = stripHTML(currentGeneratedHTML);
      const filename = `dmedesk-${activeTemplateType}-email.txt`;
      downloadBlob(plainText, filename, "text/plain");
      showToast(`Exported ${filename}`);
    }

    // Strip HTML Tags helper
    function stripHTML(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      let text = doc.body.textContent || "";
      // Clean duplicate carriage returns
      text = text.replace(/\n\s*\n/g, '\n\n').trim();
      return text;
    }

    // File trigger download helper
    function downloadBlob(content, filename, contentType) {
      const blob = new Blob([content], { type: contentType });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }
  </script>
